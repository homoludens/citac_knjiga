[project]
name = "citac-knjiga-model-tools"
version = "0.1.0"
description = "Desktop model tooling for the Serbian Kokoro Dragana audiobook pipeline (parity, reference captures, packaging)"
requires-python = "==3.11.14"
# The pinned Kokoro git revision is mandatory. The PyPI kokoro==0.9.4 wheel has
# a different weight-norm implementation and produces noise with these weights.
# Do NOT replace it. See model-tools/runtime-pins.md.
dependencies = [
    "kokoro @ git+https://github.com/semidark/kokoro.git@b96fef95e6a746495f92443fac7c688f90fc57fc",
    "soundfile==0.14.0",
    # ONNX tooling for task 2.2+ (torch.onnx dynamo exporter needs onnx +
    # onnxscript + onnx_ir; onnxruntime is the desktop parity runtime).
    "onnx==1.22.0",
    "onnxruntime==1.29.0",
    "onnxscript==0.7.1",
]

[dependency-groups]
dev = ["jsonschema==4.26.0", "pytest==8.4.2", "pyyaml==6.0.3"]

# System espeak-ng (phonenumber, `-v sr`) is a runtime requirement, not a pip
# dependency. See DEPLOYMENT.md.
